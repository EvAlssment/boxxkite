apiVersion: boxxkite.dev/v1alpha1
kind: FleetCapacity
clusters:
  - name: us-east
    region: us-east-1
    warmPool:
      maxSize: 12
      targets:
        small: 10
        medium: 0
        large: 2
    images:
      sandbox: boxxkite-sandbox:latest
      sidecar: boxxkite-sidecar:latest
    nodeSelector:
      kubernetes.io/os: linux
      # This example pins amd64 explicitly; the minimal image and sidecar also
      # support arm64, while the full sandbox is still amd64-only.
      kubernetes.io/arch: amd64
    tolerations: []
  - name: eu-west
    region: eu-west-1
    warmPool:
      maxSize: 8
      targets:
        small: 5
        medium: 0
        large: 0
    images:
      sandbox: boxxkite-sandbox:latest
      sidecar: boxxkite-sidecar:latest
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
    tolerations: []
