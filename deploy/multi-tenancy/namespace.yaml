# One namespace per tenant -- the supported multi-tenancy model for a
# self-hosted install (docs/SELF-HOSTED-MULTI-TENANCY.md).
#
# The namespace IS the tenant boundary here, because sandbox pods carry no
# tenant label of their own: they're labelled `app: sandbox` plus pool/status/
# size, and nothing identifies which account they belong to. Every
# namespace-scoped control in this directory depends on that.
#
# Replace TENANT throughout, then point that tenant's control-plane at this
# namespace with SANDBOX_NAMESPACE=boxxkite-TENANT.
apiVersion: v1
kind: Namespace
metadata:
  name: boxxkite-TENANT
  labels:
    boxxkite.dev/tenant: TENANT
# DELIBERATELY NO Pod Security Admission labels here. Neither `restricted`
# nor `baseline` can be used on a namespace that runs sandbox pods: the
# sidecar container runs as UID 0 and adds SYS_ADMIN and SYS_PTRACE (see
# deploy/pod-template.yaml, and SECURITY.md on why that is inherent to the
# current design rather than a misconfiguration). `restricted` rejects it on
# runAsNonRoot, and `baseline` rejects it too because its capability
# allowlist excludes SYS_ADMIN and SYS_PTRACE. Labelling the namespace
# either way does not harden anything, it just stops every sandbox pod from
# being admitted.
#
# Use pod-hardening-policy.yaml in this directory instead. It blocks the
# node-compromise vectors that actually matter (hostNetwork, hostPID,
# hostIPC, hostPath, privileged) without touching the capability grant the
# sidecar needs.
