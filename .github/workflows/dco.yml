name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MISSING=0
          for sha in $(git log --format=%H "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer (see CONTRIBUTING.md's DCO section)."
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "One or more commits aren't signed off. Fix with:"
            echo "  git rebase --signoff $BASE_SHA"
            echo "  git push --force-with-lease"
            exit 1
          fi
