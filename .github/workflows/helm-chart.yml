name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - deploy/helm/boxxkite/**
      - tests/test_helm_smoke.py
      - .github/workflows/helm-chart.yml
  pull_request:
    branches: [main]
    paths:
      - deploy/helm/boxxkite/**
      - tests/test_helm_smoke.py
      - .github/workflows/helm-chart.yml

permissions:
  contents: read

jobs:
  lint-and-template:
    name: Lint and template Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Pin to setup-helm v4.2.0's immutable release commit.
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.0
      - name: Lint chart values and templates
        run: helm lint deploy/helm/boxxkite
      - name: Render chart with schema validation
        run: helm template boxxkite deploy/helm/boxxkite --set namespace=boxxkite
      # ci.yml never installs helm, so tests/test_helm_smoke.py skips its whole
      # module there (module-level skipif on `helm` being absent from PATH).
      # This job is the only place those cases can actually execute, and they
      # are what verifies the schema REJECTS bad values -- the point of having
      # a schema at all. Needs no package install: the test shells out to helm
      # and imports nothing from boxxkite.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run Helm schema tests
        run: |
          pip install --quiet pytest pyyaml
          pytest tests/test_helm_smoke.py -q
