[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxxkite-eval"
version = "0.1.0"
description = "A sequential sandbox-backed agent evaluation harness."
requires-python = ">=3.10"
dependencies = ["boxxkite-client>=0.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
