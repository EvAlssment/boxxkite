[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxxkite-memory-model-server"
version = "0.1.0"
description = "Local Hugging Face Qwen embedding and reranking service for Boxkite MemoryBase"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "safetensors>=0.5,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools]
py-modules = ["app"]
